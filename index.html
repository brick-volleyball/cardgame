<!DOCTYPE html>
<!-- BRICK CARD HERO v0.1.0 (2026-09-24) : single-file / GitHub Pages対応 -->
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#182338"><meta name="apple-mobile-web-app-capable" content="yes">
<title>BRICK CARD HERO v0.1.0</title>
<style>:root{
  --navy:#182338; --navy2:#22314d; --navy3:#2d4063; --tq:#4FC3D9; --or:#E8703A; --ink:#eef3f8; --mute:#9fb0c8;
  --card:#f7f4ec; --cardink:#182338; --good:#3fd18a; --bad:#ff5d6c; --gold:#ffd34d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--navy);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;overscroll-behavior:none}
body{background:radial-gradient(120% 80% at 50% 0%,#233454 0%,var(--navy) 60%)}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select{font:inherit}
.hidden{display:none!important}
#app{max-width:520px;margin:0 auto;min-height:100%;position:relative}
.screen{min-height:100dvh;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0}
.ver{font-size:11px;color:var(--mute);text-align:center}
.ver b{color:var(--tq)}
.topbar{display:flex;align-items:center;gap:8px}
.topbar h2{font-size:18px;flex:1}
.back{padding:8px 10px;border-radius:10px;background:var(--navy2);font-size:14px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--navy2);font-weight:700;font-size:16px;text-align:center;border:1px solid #33496f}
.btn.pri{background:linear-gradient(180deg,#ff8a4f,var(--or));border-color:#ff9a66;color:#fff}
.btn.tq{background:linear-gradient(180deg,#6fd6e8,var(--tq));border-color:#8fe3f0;color:var(--navy)}
.btn:disabled{opacity:.4}
.btn.sm{padding:9px 10px;font-size:14px;border-radius:10px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.panel{background:var(--navy2);border:1px solid #33496f;border-radius:16px;padding:12px}
.muted{color:var(--mute);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;background:#0e1626;font-size:13px;font-weight:700}

/* タイトル */
.logo{text-align:center;padding:26px 0 6px}
.logo .t1{font-size:14px;letter-spacing:.3em;color:var(--tq);font-weight:800}
.logo .t2{font-size:38px;font-weight:900;line-height:1.05;letter-spacing:.02em}
.logo .t2 span{color:var(--or)}
.logo .t3{font-size:12px;color:var(--mute);margin-top:6px}
.menu{display:grid;gap:10px}
.menu .btn{display:flex;align-items:center;gap:12px;text-align:left;padding:16px}
.menu .btn .ic{width:42px;height:42px;border-radius:12px;background:#0e1626;display:grid;place-items:center;font-size:22px;flex:none}
.menu .btn small{display:block;font-weight:400;font-size:12px;opacity:.8}
.bpbar{display:flex;justify-content:center;gap:10px}
.heroes{display:flex;justify-content:center;gap:4px;margin-top:4px}
.heroes .av{width:52px;height:52px;border-radius:50%;background:#2d4063}

/* ルール選択 */
.rules{display:grid;gap:8px}
.rule{padding:12px;border-radius:14px;background:var(--navy2);border:2px solid transparent;text-align:left}
.rule b{font-size:15px}
.rule.on{border-color:var(--tq);background:#1f3553}
.code{font-size:44px;font-weight:900;letter-spacing:.25em;text-align:center;color:var(--tq);font-family:Menlo,monospace}
.codein{width:100%;font-size:32px;text-align:center;letter-spacing:.3em;padding:10px;border-radius:12px;border:2px solid var(--tq);background:#0e1626;color:#fff}
.status{text-align:center;font-size:14px;color:var(--mute)}

/* カード（一覧・手札・ガチャ） */
.card{position:relative;background:var(--card);color:var(--cardink);border-radius:10px;padding:4px;display:flex;flex-direction:column;align-items:stretch;box-shadow:0 2px 0 #0006;border:2px solid #d9d2c0;overflow:hidden}
.card.mag{background:#eaf6f9;border-color:#a8dbe6}
.card.r2{border-color:#c0c7d6;background:linear-gradient(160deg,#fff,#e4e9f3)}
.card.r3{border-color:var(--gold);background:linear-gradient(160deg,#fff8dc,#f6e2a0)}
.card .art{background:#dfe8f2;border-radius:6px;aspect-ratio:1/1;overflow:hidden}
.card.mag .art{background:#fff}
.card .art svg{width:100%;height:100%;display:block}
.card .nm{font-size:11px;font-weight:800;line-height:1.2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tt{font-size:9px;color:#5b6679;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .rar{position:absolute;top:3px;left:5px;font-size:10px;color:var(--or);text-shadow:0 0 2px #fff}
.card .cost{position:absolute;top:3px;right:4px;display:flex;align-items:center;gap:1px;font-size:11px;font-weight:900;background:#fff;border-radius:99px;padding:0 4px 0 1px}
.card .hp{font-size:10px;font-weight:800}
.card .newb{position:absolute;top:30%;left:0;right:0;text-align:center;font-weight:900;color:#fff;background:var(--or);font-size:12px;transform:rotate(-8deg)}

/* 対戦画面 */
#game{padding:6px 8px 0;gap:6px;height:100dvh;min-height:0}
.pbar{display:flex;align-items:center;gap:6px;background:var(--navy2);border-radius:12px;padding:6px 8px;font-size:13px}
.pbar .nm{font-weight:800;max-width:30%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pbar .sp{flex:1}
.pbar.turn{box-shadow:0 0 0 2px var(--or) inset}
.hearts{letter-spacing:-1px;color:var(--bad);font-size:13px;white-space:nowrap}
.hpnum{font-weight:900}
.field{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1;min-height:0}
.field.speed{grid-template-columns:1fr;width:62%;margin:0 auto}
.slot{position:relative;border-radius:12px;border:2px dashed #3a5278;display:flex;align-items:stretch;justify-content:center;min-height:0;padding:3px;transition:transform .15s}
.slot .lbl{position:absolute;inset:auto 0 3px;text-align:center;font-size:10px;color:#58709a}
.slot.tgt{border:2px solid var(--or);background:#e8703a22;animation:pulse 1s infinite}
.slot.sel{border:2px solid var(--tq);background:#4fc3d922}
@keyframes pulse{50%{background:#e8703a44}}
.mon{flex:1;display:flex;gap:4px;background:var(--card);color:var(--cardink);border-radius:9px;padding:3px;min-width:0;position:relative;overflow:hidden}
.mon.opp{background:#f1e6e6}
.mon .art{height:100%;aspect-ratio:1/1;max-width:48%;border-radius:7px;background:#dfe8f2;overflow:hidden;flex:none}
.mon .art svg{width:100%;height:100%;display:block}
.mon .inf{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.mon .nm{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mon .tt{font-size:9px;color:#5b6679;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mon .lv{font-size:10px;font-weight:900;color:var(--or)}
.hpbar{display:flex;gap:2px;flex-wrap:wrap}
.hpbar i{width:9px;height:9px;border-radius:2px;background:var(--good)}
.hpbar i.x{background:#cfd6df}
.badges{display:flex;gap:2px;flex-wrap:wrap}
.bdg{font-size:9px;font-weight:900;padding:1px 4px;border-radius:4px;color:#fff;background:#6b7890}
.bdg.wu{background:#6b7890}.bdg.ki{background:var(--or)}.bdg.done{background:#98a3b5}.bdg.bl{background:#2f7fb0}
.mon.can{box-shadow:0 0 0 2px var(--good)}
.mon.wait{opacity:.8}
.mon.wait .art{filter:grayscale(.7)}
.net{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--mute)}
.net::before,.net::after{content:"";flex:1;height:4px;background:repeating-linear-gradient(90deg,#fff 0 6px,transparent 6px 10px);opacity:.5}
.net.mine{color:var(--or)}
.capt{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:10px;border:2px solid transparent}
.capt .av{width:30px;height:30px;border-radius:50%;background:#2d4063}
.capt.tgt{border-color:var(--or)}
.hand{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;min-height:112px;scroll-snap-type:x mandatory}
.hand .card{flex:0 0 72px;scroll-snap-align:start}
.hand .card.sel{outline:3px solid var(--tq);transform:translateY(-4px)}
.hand .card.dim{opacity:.55}
.hand .empty{color:var(--mute);font-size:13px;align-self:center;padding:0 8px}
.gbtns{display:flex;gap:6px;padding-bottom:max(8px,env(safe-area-inset-bottom));flex:none}
.gbtns .btn{flex:1;width:auto;padding:11px 6px;font-size:14px;white-space:nowrap}
.gbtns .btn.end{flex:2.2}
.pbar,.hand,.net{flex:none}
.lastlog{flex:none;font-size:11px;color:#cfdbea;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:15px;margin-top:-4px}
.dmgfx{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:26px;font-weight:900;color:var(--bad);text-shadow:0 2px 0 #000,0 0 6px #fff;pointer-events:none;animation:fly 1s forwards;z-index:5}
.dmgfx.heal{color:var(--good)}
.dmgfx.lv{color:var(--gold)}
@keyframes fly{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* シート・モーダル */
.sheetbg{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--navy2);border-radius:18px 18px 0 0;padding:14px 16px max(16px,env(safe-area-inset-bottom));max-height:80dvh;overflow:auto;animation:up .18s}
@keyframes up{from{transform:translateY(30%)}}
.sheet h3{font-size:17px}
.sheet .head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.sheet .head .art{width:72px;height:72px;border-radius:12px;background:#dfe8f2;overflow:hidden;flex:none}
.sheet .head .art svg{width:100%;height:100%}
.acts{display:grid;gap:6px;margin-top:8px}
.act{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:#0e1626;text-align:left;border:1px solid #33496f}
.act .n{font-weight:800;flex:1}
.act .d{font-size:12px;color:var(--mute)}
.act:disabled{opacity:.45}
.act.go{border-color:var(--or)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#0e1626ee;border:1px solid var(--tq);padding:8px 14px;border-radius:12px;font-size:13px;z-index:40;max-width:92%;text-align:center;animation:fadein .2s}
.toast.err{border-color:var(--bad)}
@keyframes fadein{from{opacity:0}}
.logbox{font-size:12px;line-height:1.6;white-space:pre-wrap;color:#cfdbea}
.banner{position:fixed;left:0;right:0;top:40%;text-align:center;font-size:30px;font-weight:900;z-index:30;pointer-events:none;animation:banner 1.3s forwards;text-shadow:0 3px 0 #000}
@keyframes banner{0%{opacity:0;transform:scale(1.6)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.result{text-align:center;padding:24px 0}
.result .big{font-size:44px;font-weight:900}
.result .big.win{color:var(--gold)}
.result .big.lose{color:var(--mute)}

/* デッキ編集 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.dcell{display:flex;flex-direction:column;gap:4px}
.dcell .ctl{display:flex;align-items:center;justify-content:space-between;background:#0e1626;border-radius:8px;padding:2px}
.dcell .ctl button{width:30px;height:28px;border-radius:6px;background:var(--navy3);font-weight:900;font-size:18px}
.dcell .ctl span{font-size:12px;font-weight:800}
.dcell.zero .card{opacity:.35}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:8px;border-radius:10px;background:var(--navy2);font-weight:700;font-size:13px}
.tabs button.on{background:var(--tq);color:var(--navy)}
.stick{position:sticky;top:0;z-index:5;background:var(--navy);padding:6px 0}

/* ガチャ */
.gacha{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.gacha .card{animation:flip .45s backwards}
@keyframes flip{from{transform:rotateY(90deg) scale(.8);opacity:0}}
.machine{display:grid;place-items:center;padding:10px}
.machine .ballbig{width:120px;height:120px}
.machine.spin .ballbig{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 設定 */
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
label.f input,label.f select{padding:10px;border-radius:10px;border:1px solid #33496f;background:#0e1626;color:#fff;font-size:16px}
.mlist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mlist button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px}
.mlist .av{width:60px;height:60px;border-radius:50%;background:#2d4063}
.swatch{display:flex;gap:6px;flex-wrap:wrap}
.swatch button{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.swatch button.on{border-color:#fff}
.help{font-size:13px;line-height:1.7}
.help h3{font-size:15px;color:var(--tq);margin:12px 0 4px}
.help table{border-collapse:collapse;width:100%;font-size:13px}
.help td{border-bottom:1px solid #33496f;padding:4px}

        var fillM = ['timeout', 'serve', 'huddle', 'basket'];
        while (mags.length < K.SPEED_MAG) mags.push(fillM[mags.length % 4]);
        ids = mons.slice(0, K.SPEED_MON).concat(mags.slice(0, K.SPEED_MAG));
      }
      var pl = {
        name: src.name || ('プレイヤー' + (p + 1)), members: src.members || {}, capt: src.capt || 'm11', skill: SKILLS[src.skill] ? src.skill : 'voice',
        hp: rule.hp, balls: 0, exp: 0, deck: [], hand: [], disc: [], field: [null, null, null, null],
        kills: 0, skillUsed: false, ready: !rule.speed
      };
      for (var i = 0; i < ids.length; i++) { var uid = 'c' + (st.nuid++); st.cards[uid] = { id: ids[i], o: p }; pl.deck.push(uid); }
      shuffle(st, pl.deck);
      st.players.push(pl);
    }
    st.first = (opt.first === 0 || opt.first === 1) ? opt.first : (rnd(st) < 0.5 ? 0 : 1);
    if (rule.speed) {
      st.players.forEach(function (pl) {
        var mons = pl.deck.filter(function (u) { return CARDS[st.cards[u].id].type === 'mon'; });
        var mags = pl.deck.filter(function (u) { return CARDS[st.cards[u].id].type === 'mag'; });
        pl.hand = mons.splice(0, K.SPEED_START_MON).concat(mags);
        pl.deck = mons;
      });
      st.phase = 'setup';
      log(st, '【スピードルール】お互いに前衛と後衛の選手を1人ずつ選んでください');
    } else {
      st.players.forEach(function (pl) { for (var i = 0; i < K.START_HAND; i++) draw(st, pl); });
      log(st, '【' + rule.label + '】試合開始！ 先攻：' + st.players[st.first].name);
      startTurn(st, st.first);
    }
    return st;
  }

  function draw(st, pl) {
    if (!pl.deck.length) return false;
    pl.hand.push(pl.deck.shift());
    return true;
  }
  function drawMonster(st, pl) {
    for (var i = 0; i < pl.deck.length; i++) {
      var u = pl.deck[i];
      if (!u || !st.cards[u] || CARDS[st.cards[u].id].type === 'mon') { pl.hand.push(pl.deck.splice(i, 1)[0]); return true; }
    }
    return false;
  }

  function startTurn(st, p) {
    st.turn = p; st.turnNo++; st.phase = 'main';
    var pl = st.players[p];
    var lim = st.rule.speed ? K.SPEED_TURN_LIMIT : K.TURN_LIMIT;
    if (st.turnNo > lim) { judgeByLimit(st); return; }
    if (!st.rule.speed && st.players[0].deck.length === 0 && st.players[1].deck.length === 0) {
      judgeByHp(st); return;
    }
    pl.balls += K.BALLS_PER_TURN;
    if (!st.rule.speed) draw(st, pl);
    pl.skillUsed = false;
    pl.field.forEach(function (m) { if (m) { m.ready = true; m.acted = false; m.fresh = false; } });
    log(st, '―― ' + st.turnNo + 'ターン目：' + pl.name + '（ボール+' + K.BALLS_PER_TURN + '）');
  }

  function judgeByHp(st) {
    var a = st.players[0].hp, b = st.players[1].hp;
    st.phase = 'over';
    st.winner = a > b ? 0 : b > a ? 1 : -1;
    st.reason = 'お互いのデッキ切れ（残りHPで判定）';
    log(st, 'お互いのデッキが切れました。残りHP判定 → ' + (st.winner < 0 ? '引き分け' : st.players[st.winner].name + 'の勝ち'));
  }

  function judgeByLimit(st) {
    var a = st.players[0], b = st.players[1];
    function fieldHp(pl) { return pl.field.reduce(function (t, m) { return t + (m ? m.hp : 0); }, 0); }
    var sa = st.rule.speed ? [a.kills, fieldHp(a)] : [a.hp, fieldHp(a)];
    var sb = st.rule.speed ? [b.kills, fieldHp(b)] : [b.hp, fieldHp(b)];
    var w = sa[0] !== sb[0] ? (sa[0] > sb[0] ? 0 : 1) : sa[1] !== sb[1] ? (sa[1] > sb[1] ? 0 : 1) : -1;
    st.turnNo--;
    gameOver(st, w, 'ターン制限（' + (st.rule.speed ? '撃破数' : '残りHP') + '→コート上の選手HPで判定）');
  }

  function finishTurn(st) {
    var p = st.turn, pl = st.players[p];
    if (!st.rule.speed) {
      pl.field.forEach(function (m) {
        if (!m) return;
        if (!m.fresh && m.ready && !m.acted) m.kiai = true;
      });
    }
    startTurn(st, other(p));
  }

  function normalize(st) {
    st.players.forEach(function (pl) {
      for (var c = 0; c < 2; c++) {
        if (!pl.field[c] && pl.field[c + 2]) { pl.field[c] = pl.field[c + 2]; pl.field[c + 2] = null; }
      }
    });
  }

  function gameOver(st, w, reason) {
    if (st.phase === 'over') return;
    st.phase = 'over'; st.winner = w; st.reason = reason;
    log(st, '★ ' + (w < 0 ? '引き分け' : st.players[w].name + 'の勝利！') + '（' + reason + '）');
  }

  function checkSpeedEnd(st) {
    if (!st.rule.speed || st.phase === 'over') return;
    for (var p = 0; p < 2; p++) {
      if (st.players[p].kills >= K.SPEED_KILLS) { gameOver(st, p, '相手選手を' + K.SPEED_KILLS + '人倒した'); return; }
    }
    for (p = 0; p < 2; p++) {
      var pl = st.players[p];
      var hasField = pl.field.some(Boolean);
      var hasHand = pl.hand.some(function (u) { return !u || !st.cards[u] || CARDS[st.cards[u].id].type === 'mon'; }); // 相手の非公開手札は「ある」とみなす
      if (!hasField && !hasHand && st.phase !== 'setup') { gameOver(st, other(p), '相手の選手がいなくなった'); return; }
    }
  }

  // ---------- damage ----------
  function damageMaster(st, src, tp, power) {
    var pl = st.players[tp];
    var d = Math.max(0, power - K.SHIELD);
    st.ev.push({ k: 'dmg', p: tp, s: 'M', n: d });
    if (d <= 0) { log(st, '  → ' + pl.name + 'のキャプテンにガードされた（ダメージ0）'); return; }
    pl.hp -= d; pl.balls += d;
    log(st, '  → ' + pl.name + 'のキャプテンに' + d + 'ダメージ！（ボール+' + d + '）');
    if (pl.hp <= 0) { pl.hp = 0; gameOver(st, other(tp), 'キャプテンのHPが0になった'); }
  }
  function damageMon(st, src, tp, s, power) {
    var pl = st.players[tp], m = pl.field[s];
    if (!m) return;
    var d = power - (m.kiai ? 1 : 0) - (lvData(m).block || 0);
    d = Math.max(0, d);
    st.ev.push({ k: 'dmg', p: tp, s: s, n: d });
    m.hp -= d;
    log(st, '  → ' + cardName(st, tp, m.id) + 'に' + d + 'ダメージ' + (m.hp > 0 ? '（残りHP' + m.hp + '）' : ''));
    if (m.hp <= 0) kill(st, src, tp, s);
  }
  function kill(st, src, tp, s) {
    var pl = st.players[tp], m = pl.field[s];
    pl.field[s] = null;
    pl.disc.push(m.uid);
    pl.balls += m.inv;
    st.players[src].exp += m.lv;
    st.players[src].kills++;
    st.ev.push({ k: 'ko', p: tp, s: s });
    log(st, '  ✕ ' + cardName(st, tp, m.id) + 'がダウン！（' + pl.name + 'にボール' + m.inv + '返却／' + st.players[src].name + 'にレベルアップ権+' + m.lv + '）');
    if (st.rule.speed) drawMonster(st, pl);
    normalize(st);
  }

  // 技の対象（自動対象の範囲はここで決まる）
  function autoTargets(st, p, s, r) {
    var op = st.players[other(p)], c = colOf(s), out = [];
    var f = op.field[c] ? c : null, b = op.field[c + 2] ? c + 2 : null;
    var hasM = st.rule.master;
    if (r === 'straight') {
      if (f !== null) out.push(f); else if (b !== null) out.push(b); else if (hasM) out.push('M');
    } else if (r === 'jump') {
      if (b !== null) out.push(b); else if (hasM) out.push('M'); else if (f !== null) out.push(f);
    } else if (r === 'pierce') {
      if (f !== null) out.push(f); if (b !== null) out.push(b); if (hasM) out.push('M');
    } else if (r === 'all') {
      op.field.forEach(function (m, i) { if (m) out.push(i); });
    }
    return out;
  }
  function needsTarget(r) { return r === 'any' || r === 'heal' || r === 'kiai'; }

  // ---------- actions ----------
  // action: {t:'summon',u,s} {t:'atk',s,a,tg} {t:'move',s,to} {t:'lvup',s} {t:'magic',u,tg} {t:'skill',tg}
  //         {t:'end'} {t:'discard',u} {t:'setup',front,back} {t:'resign'}
  // tg: 相手選手のスロット番号 or 味方選手のスロット番号（効果による）
  function apply(st, p, a) {
    st.ev = [];
    var err = applyInner(st, p, a);
    if (!err) { normalize(st); checkSpeedEnd(st); }
    return err;
  }

  function applyInner(st, p, a) {
    if (!a || !a.t) return '不正な操作';
    if (st.phase === 'over') return '試合は終了しています';
    var pl = st.players[p], op = st.players[other(p)];
    if (a.t === 'resign') { log(st, pl.name + 'が棄権しました'); gameOver(st, other(p), '棄権'); return null; }

    if (st.phase === 'setup') {
      if (a.t !== 'setup') return 'まず選手を配置してください';
      if (!pl.ready) {
        var fu = a.front, bu = a.back;
        if (fu === bu || pl.hand.indexOf(fu) < 0 || pl.hand.indexOf(bu) < 0) return '選手を2人選んでください';
        if (CARDS[st.cards[fu].id].type !== 'mon' || CARDS[st.cards[bu].id].type !== 'mon') return '選手カードを選んでください';
        [[fu, 0], [bu, 2]].forEach(function (x) {
          pl.hand.splice(pl.hand.indexOf(x[0]), 1);
          pl.field[x[1]] = mkMon(st, x[0], 0, true);
        });
        pl.ready = true;
        log(st, pl.name + 'が選手を配置しました');
      }
      if (st.players[0].ready && st.players[1].ready) {
        log(st, '試合開始！ 先攻：' + st.players[st.first].name);
        startTurn(st, st.first);
      }
      return null;
    }

    if (st.turn !== p) return '相手のターンです';

    if (st.phase === 'discard') {
      if (a.t !== 'discard') return '手札が' + K.HAND_LIMIT + '枚になるまで捨ててください';
      var di = pl.hand.indexOf(a.u); if (di < 0) return 'そのカードはありません';
      pl.hand.splice(di, 1); pl.disc.push(a.u);
      log(st, pl.name + 'が「' + cardName(st, p, st.cards[a.u].id) + '」を捨てた');
      if (pl.hand.length <= K.HAND_LIMIT) finishTurn(st);
      return null;
    }

    switch (a.t) {
      case 'end': {
        if (st.rule.speed) {
          var hasMonHand = pl.hand.some(function (u) { return CARDS[st.cards[u].id].type === 'mon'; });
          if (hasMonHand && (!pl.field[0] || !pl.field[2])) return '空いているポジションに選手を入れてください';
        }
        log(st, pl.name + 'のターン終了');
        if (!st.rule.speed && pl.hand.length > K.HAND_LIMIT) { st.phase = 'discard'; log(st, '手札が' + K.HAND_LIMIT + '枚を超えています。捨てるカードを選んでください'); return null; }
        finishTurn(st); return null;
      }
      case 'summon': {
        var hi = pl.hand.indexOf(a.u); if (hi < 0) return 'そのカードはありません';
        var cd = CARDS[st.cards[a.u].id]; if (cd.type !== 'mon') return '選手カードではありません';
        if (slotsFor(st).indexOf(a.s) < 0 || pl.field[a.s]) return 'そこには出せません';
        var cost = st.rule.speed ? 0 : K.SUMMON_COST;
        if (pl.balls < cost) return 'ボールが足りません';
        pl.balls -= cost; pl.hand.splice(hi, 1);
        pl.field[a.s] = mkMon(st, a.u, cost, st.rule.speed);
        st.ev.push({ k: 'in', p: p, s: a.s });
        log(st, pl.name + 'が' + cardName(st, p, cd === null ? '' : st.cards[a.u].id) + 'をコートイン' + (st.rule.speed ? '' : '（ウォームアップ中）'));
        return null;
      }
      case 'lvup': {
        var m = pl.field[a.s]; if (!m) return '選手がいません';
        if (m.lv >= 3) return 'これ以上レベルアップできません';
        if (pl.exp < 1) return 'レベルアップ権がありません（相手選手を倒すと得られます）';
        if (pl.balls < K.LEVELUP_BALL) return 'ボールが足りません';
        pl.exp--; pl.balls -= K.LEVELUP_BALL; m.lv++; m.inv += K.LEVELUP_BALL; m.hp = lvData(m).hp;
        st.ev.push({ k: 'lv', p: p, s: a.s });
        log(st, cardName(st, p, m.id) + 'がLv' + m.lv + 'にレベルアップ！（HP全回復）');
        return null;
      }
      case 'move': {
        var mm = pl.field[a.s]; if (!mm) return '選手がいません';
        if (!mm.ready) return 'ウォームアップ中は動けません';
        if (mm.acted) return 'この選手はもう行動しました';
        if (slotsFor(st).indexOf(a.to) < 0 || a.to === a.s) return 'そこには移動できません';
        var before = JSON.stringify(pl.field.map(function (x) { return x && x.uid; }));
        var tmp = pl.field[a.to]; pl.field[a.to] = mm; pl.field[a.s] = tmp;
        normalize(st);
        var after = JSON.stringify(pl.field.map(function (x) { return x && x.uid; }));
        if (before === after) { return '移動しても位置が変わりません'; }
        mm.acted = true; mm.kiai = false;
        log(st, cardName(st, p, mm.id) + 'が' + slotName(a.to) + 'へローテーション');
        return null;
      }
      case 'atk': {
        var am = pl.field[a.s]; if (!am) return '選手がいません';
        if (!am.ready) return 'ウォームアップ中は行動できません';
        if (am.acted) return 'この選手はもう行動しました';
        var atk = lvData(am).atk[a.a]; if (!atk) return 'その技はありません';
        if (atk.f === 'front' && !isFront(a.s)) return 'この技は前衛でしか使えません';
        if (atk.f === 'back' && isFront(a.s)) return 'この技は後衛でしか使えません';
        if (pl.balls < atk.c) return 'ボールが足りません';
        var tg = resolveTargets(st, p, a.s, atk.r, a.tg);
        if (typeof tg === 'string') return tg;
        pl.balls -= atk.c; am.acted = true;
        var bonus = am.kiai ? 1 : 0; am.kiai = false;
        log(st, cardName(st, p, am.id) + 'の「' + atk.n + '」' + (bonus ? '（集中+1）' : ''));
        st.ev.push({ k: 'act', p: p, s: a.s });
        runEffect(st, p, atk.r, atk.p + bonus, tg, atk.p);
        return null;
      }
      case 'magic': {
        var mi = pl.hand.indexOf(a.u); if (mi < 0) return 'そのカードはありません';
        var mc = CARDS[st.cards[a.u].id]; if (mc.type !== 'mag') return '作戦カードではありません';
        if (pl.balls < mc.cost) return 'ボールが足りません';
        var mt = magicTargets(st, p, mc.eff, a.tg);
        if (typeof mt === 'string') return mt;
        pl.balls -= mc.cost; pl.hand.splice(mi, 1); pl.disc.push(a.u);
        log(st, pl.name + 'が作戦「' + mc.name + '」を使った');
        runMagic(st, p, mc.eff, mc.n, mt);
        return null;
      }
      case 'skill': {
        if (!st.rule.skill) return 'このルールではキャプテン特技は使えません';
        if (pl.skillUsed) return 'キャプテン特技は1ターンに1回です';
        var sk = SKILLS[pl.skill];
        if (pl.balls < sk.cost) return 'ボールが足りません';
        var stg = magicTargets(st, p, sk.eff, a.tg);
        if (typeof stg === 'string') return stg;
        pl.balls -= sk.cost; pl.skillUsed = true;
        log(st, pl.name + 'のキャプテン特技「' + sk.name + '」！');
        runMagic(st, p, sk.eff, sk.n, stg);
        return null;
      }
    }
    return '不明な操作です';
  }

  function mkMon(st, uid, inv, ready) {
    var id = st.cards[uid].id;
    return { uid: uid, id: id, lv: 1, hp: CARDS[id].lv[0].hp, ready: !!ready, acted: false, kiai: false, fresh: true, inv: inv };
  }

  function resolveTargets(st, p, s, r, tg) {
    var pl = st.players[p], op = st.players[other(p)];
    if (r === 'any') {
      if (typeof tg !== 'number' || !op.field[tg]) return '相手選手を選んでください';
      return [tg];
    }
    if (r === 'heal') {
      if (typeof tg !== 'number' || !pl.field[tg]) return '味方選手を選んでください';
      return [tg];
    }
    if (r === 'kiai') {
      if (typeof tg !== 'number' || !pl.field[tg] || tg === s) return '他の味方選手を選んでください';
      return [tg];
    }
    if (r === 'kiaiAll' || r === 'ball') return [];
    var t = autoTargets(st, p, s, r);
    if (!t.length) return '攻撃できる相手がいません';
    return t;
  }

  function runEffect(st, p, r, power, tg, base) {
    var pl = st.players[p], op = other(p);
    if (r === 'heal') { heal(st, p, tg[0], base); return; }
    if (r === 'kiai') { pl.field[tg[0]].kiai = true; log(st, '  → ' + cardName(st, p, pl.field[tg[0]].id) + 'が集中状態に'); return; }
    if (r === 'kiaiAll') { pl.field.forEach(function (m) { if (m) m.kiai = true; }); log(st, '  → 味方全員が集中状態に'); return; }
    if (r === 'ball') { pl.balls += base; log(st, '  → ボール+' + base); return; }
    // 攻撃：先に対象を確定してから順にダメージ
    var list = tg.map(function (t) { return t === 'M' ? { M: 1 } : { s: t, uid: st.players[op].field[t].uid }; });
    list.forEach(function (x) {
      if (st.phase === 'over') return;
      if (x.M) damageMaster(st, p, op, power);
      else {
        // 途中で前に詰めた場合も同じ選手を狙う
        var idx = st.players[op].field.findIndex(function (m) { return m && m.uid === x.uid; });
        if (idx >= 0) damageMon(st, p, op, idx, power);
      }
    });
  }

  function heal(st, p, s, n) {
    var m = st.players[p].field[s]; var mx = lvData(m).hp;
    var before = m.hp; m.hp = Math.min(mx, m.hp + n);
    st.ev.push({ k: 'heal', p: p, s: s, n: m.hp - before });
    log(st, '  → ' + cardName(st, p, m.id) + 'のHPが' + (m.hp - before) + '回復');
  }

  function magicTargets(st, p, eff, tg) {
    var pl = st.players[p], op = st.players[other(p)];
    if (eff === 'heal' || eff === 'kiai' || eff === 'swap') {
      if (typeof tg !== 'number' || !pl.field[tg]) return '味方選手を選んでください';
      if (eff === 'swap') {
        var c = colOf(tg);
        if (!pl.field[c + 2]) return 'この列の後衛がいないので入れ替えられません';
      }
      return [tg];
    }
    if (eff === 'dmg') {
      if (typeof tg !== 'number' || !op.field[tg]) return '相手選手を選んでください';
      return [tg];
    }
    return [];
  }

  function runMagic(st, p, eff, n, tg) {
    var pl = st.players[p];
    if (eff === 'heal') heal(st, p, tg[0], n);
    else if (eff === 'kiai') { pl.field[tg[0]].kiai = true; log(st, '  → ' + cardName(st, p, pl.field[tg[0]].id) + 'が集中状態に'); }
    else if (eff === 'kiaiAll') { pl.field.forEach(function (m) { if (m) m.kiai = true; }); log(st, '  → 味方全員が集中状態に'); }
    else if (eff === 'dmg') damageMon(st, p, other(p), tg[0], n);
    else if (eff === 'draw') { var k = 0; for (var i = 0; i < n; i++) if (draw(st, pl)) k++; log(st, '  → カードを' + k + '枚引いた'); }
    else if (eff === 'exp') { pl.exp += n; log(st, '  → レベルアップ権+' + n); }
    else if (eff === 'swap') {
      var c = colOf(tg[0]); var f = pl.field[c], b = pl.field[c + 2];
      pl.field[c] = b; pl.field[c + 2] = f; normalize(st);
      log(st, '  → 前衛と後衛を入れ替えた');
    }
  }

  // ---------- 合法手の列挙（UIのヒントとCPU用） ----------
  function legal(st, p) {
    var out = [];
    if (st.phase === 'over') return out;
    var pl = st.players[p], op = st.players[other(p)];
    if (st.phase === 'setup') {
      if (pl.ready) return out;
      var ms = pl.hand.filter(function (u) { return CARDS[st.cards[u].id].type === 'mon'; });
      ms.forEach(function (f) { ms.forEach(function (b) { if (f !== b) out.push({ t: 'setup', front: f, back: b }); }); });
      return out;
    }
    if (st.turn !== p) return out;
    if (st.phase === 'discard') { pl.hand.forEach(function (u) { out.push({ t: 'discard', u: u }); }); return out; }
    var slots = slotsFor(st);
    var mySl = slots.filter(function (s) { return pl.field[s]; });
    var opSl = slots.filter(function (s) { return op.field[s]; });
    pl.hand.forEach(function (u) {
      var c = CARDS[st.cards[u].id];

    h += '<div class="tabs"><button class="' + (m.glasses ? 'on' : '') + '" data-a="mtog" data-v="glasses">メガネ</button><button class="' + (m.band ? 'on' : '') + '" data-a="mtog" data-v="band">ヘアバンド</button></div>';
    app.innerHTML = h + verLine() + '</div>';
    document.getElementById('mname').addEventListener('change', function (e) { m.name = e.target.value.trim() || m.name; save(); memberEdit(); });
    document.getElementById('mnum').addEventListener('change', function (e) { m.num = e.target.value.replace(/\D/g, '').slice(0, 2); save(); memberEdit(); });
  }
  H.mset = function (v) { var p = v.split('|'); S.members[editing][p[0]] = p[1]; save(); var y = window.scrollY; memberEdit(); window.scrollTo(0, y); };
  H.mtog = function (k) { S.members[editing][k] = !S.members[editing][k]; save(); var y = window.scrollY; memberEdit(); window.scrollTo(0, y); };

  // ---------- 遊び方 ----------
  function helpHTML() {
    return '<div class="help">' +
      '<h3>用語（原作 → BRICK版）</h3><table>' +
      [['ストーン', 'ボール'], ['モンスター', '選手'], ['マジック', '作戦カード'], ['マスター', 'キャプテン'], ['マスターの特技', 'キャプテン特技'], ['召喚', 'コートイン'], ['移動', 'ローテーション'], ['きあいだめ', '集中'], ['準備中', 'ウォームアップ中（W-UP）'], ['レベルアップ権', 'レベルアップ権（⬆）']].map(function (r) { return '<tr><td>' + r[0] + '</td><td>→ <b>' + r[1] + '</b></td></tr>'; }).join('') + '</table>' +
      '<h3>基本の流れ（ノーマル／スーパー／マスター）</h3>' +
      '・自分のターン開始時にボール+' + K.BALLS_PER_TURN + '、カードを1枚引く。初期手札' + K.START_HAND + '枚、手札上限' + K.HAND_LIMIT + '枚<br>' +
      '・選手はボール' + K.SUMMON_COST + 'でコートイン。出したターンは<b>ウォームアップ中</b>で動けない<br>' +
      '・コートは前衛2・後衛2。前衛が空くと後衛が自動で前に出る<br>' +
      '・各選手は1ターンに1回「技」か「ローテーション」ができる。何もしなかった選手は<b>集中</b>（次の攻撃+1、受けるダメージ-1）<br>' +
      '・相手選手を倒すと<b>レベルアップ権</b>（倒した選手のLv分）。権1＋ボール' + K.LEVELUP_BALL + 'でLvアップ（HP全回復）<br>' +
      '・倒された側には、その選手に使ったボールが戻る<br>' +
      '・キャプテンは攻撃を<b>' + K.SHIELD + '軽減</b>（3P以上でないと効かない）。受けたダメージ分ボールがもらえる<br>' +
      '・キャプテンのHPを0にしたら勝ち。お互いの山札が切れたら残りHPで判定' +
      '<h3>ルール</h3>' +
      '・<b>スピード</b>：キャプテンなし。前衛1・後衛1。選手10枚＋作戦4枚。最初に選手3枚、自分の選手が倒されるたび選手を1枚引く。集中・W-UPなし。相手を5人倒したら勝ち（' + K.SPEED_TURN_LIMIT + 'ターンで撃破数判定）<br>' +
      '・<b>ノーマル</b>：キャプテンHP5、特技なし<br>・<b>スーパー</b>：キャプテンHP5、特技あり（1ターン1回）<br>・<b>マスター</b>：キャプテンHP10、特技あり' +
      '<h3>技の範囲</h3>' +
      '・正面：同じ列の相手の一番手前（前衛→後衛→キャプテン）<br>・ひとつとび：同じ列の相手後衛（いなければキャプテン）<br>・貫通：同じ列の前衛・後衛・キャプテン全員<br>・ねらい撃ち：好きな相手選手<br>・全体：相手選手全員' +
      '</div>';
  }
  function help() { app.innerHTML = '<div class="screen">' + top('遊び方', 'settings') + helpHTML() + verLine() + '</div>'; }

  // 画面を離れる時の通知
  window.addEventListener('pagehide', function () { if (NET.conn) send({ t: 'bye' }); });
  // テスト用フック
  window.__BCH_APP = { get G() { return G; }, get NET() { return NET; }, act: act, go: go, S: function () { return S; } };

  go('home');
})();
</script>
